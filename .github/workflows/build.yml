name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'release/v**'
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'img/**'
      - 'benchmarks/**'
      - 'samples/**'
      - '*.sln'
  pull_request:
    branches:
      - main
      - 'release/v**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lifetime: [Singleton, Scoped, Transient]
        publisher: [ForeachAwait, TaskWhenAll]
        size: [Default, Large]

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0 # depth is needed for nbgv

    - name: Setup .NET
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: '8.0.x'
        include-prerelease: false

    - uses: actions/cache@v3
      with:
        path: ${{ github.workspace }}/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.*.props', 'NuGet.config') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore

    - name: Clean
      run: dotnet clean -v m

    - name: Build Mediator.Tests
      run: dotnet build --no-restore -p:ExtraDefineConstants=\"Mediator_Lifetime_${{ matrix.lifetime }}%3BMediator_Publisher_${{ matrix.publisher }}%3BMediator_${{matrix.size}}_Project\" -v m ./test/Mediator.Tests/

    - name: Test Mediator.Tests
      run: dotnet test --no-restore --no-build --logger "console;verbosity=detailed" ./test/Mediator.Tests/

  samples-net:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./samples/Showcase

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0 # depth is needed for nbgv

    - name: Setup .NET
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: '8.0.x'
        include-prerelease: false

    - uses: actions/cache@v3
      with:
        path: ${{ github.workspace }}/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.*.props', 'NuGet.config') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Run
      run: dotnet run

  samples-net-nupkg:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./samples/Showcase

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0 # depth is needed for nbgv

    - name: Setup .NET
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: '8.0.x'
        include-prerelease: false

    - uses: actions/cache@v3
      with:
        path: ${{ github.workspace }}/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.csproj', '**/Directory.*.props', 'NuGet.config') }}
        restore-keys: |
          ${{ runner.os }}-nuget-${{ hashFiles('global.json') }}-

    - name: Pack local NuGet packages
      id: pack
      working-directory: .
      run: |
        mkdir -p ./artifacts/packages
        dotnet build ./src/Mediator/Mediator.csproj -c Debug -v q
        dotnet build ./src/Mediator.SourceGenerator/Mediator.SourceGenerator.csproj -c Debug -v q
        dotnet pack ./src/Mediator/Mediator.csproj -c Debug --no-build -o ./artifacts/packages -v q
        dotnet pack ./src/Mediator.SourceGenerator/Mediator.SourceGenerator.csproj -c Debug --no-build -o ./artifacts/packages -v q
        package_path="$(ls -1t ./artifacts/packages/Mediator.SourceGenerator.*.nupkg | head -n 1)"
        package_version="${package_path##*/}"
        package_version="${package_version#Mediator.SourceGenerator.}"
        package_version="${package_version%.nupkg}"
        echo "version=$package_version" >> "$GITHUB_OUTPUT"

    - name: Create local NuGet config
      run: |
        cat > NuGet.Local.config <<EOF
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <clear />
            <add key="local" value="${{ github.workspace }}/artifacts/packages" />
            <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
          </packageSources>
          <packageSourceMapping>
            <packageSource key="local">
              <package pattern="Mediator.SourceGenerator" />
              <package pattern="Mediator.Abstractions" />
            </packageSource>
            <packageSource key="nuget.org">
              <package pattern="*" />
            </packageSource>
          </packageSourceMapping>
        </configuration>
        EOF

    - name: Restore
      run: |
        dotnet restore Showcase.csproj --configfile NuGet.Local.config \
          -p:UseLocalMediatorProjects=false \
          -p:MediatorPackageVersion=${{ steps.pack.outputs.version }}

    - name: Build
      run: |
        dotnet build Showcase.csproj --no-restore \
          -p:UseLocalMediatorProjects=false \
          -p:MediatorPackageVersion=${{ steps.pack.outputs.version }}

    - name: Run
      run: |
        dotnet run --no-restore --no-build \
          -p:UseLocalMediatorProjects=false \
          -p:MediatorPackageVersion=${{ steps.pack.outputs.version }}

  samples-aot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./samples/basic/ConsoleAOT

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0 # depth is needed for nbgv

    - name: Setup .NET
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: '8.0.x'
        include-prerelease: false

    - uses: actions/cache@v3
      with:
        path: ${{ github.workspace }}/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.*.props', 'NuGet.config') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Publish
      run: dotnet publish -r linux-x64 -c Release

    - name: Run
      run: ./bin/Release/net8.0/linux-x64/ConsoleAOT

  samples-netfx:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .\samples\basic\NetFramework\

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0 # depth is needed for nbgv

    - uses: actions/cache@v3
      with:
        path: ${{ github.workspace }}/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.*.props', 'NuGet.config') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Setup .NET
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: '8.0.x'
        include-prerelease: false

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Pack local NuGet packages
      id: pack
      shell: pwsh
      working-directory: ${{ github.workspace }}
      run: |
        New-Item -ItemType Directory -Force -Path .\artifacts\packages | Out-Null
        dotnet build .\src\Mediator\Mediator.csproj -c Debug -v q
        dotnet build .\src\Mediator.SourceGenerator\Mediator.SourceGenerator.csproj -c Debug -v q
        dotnet pack .\src\Mediator\Mediator.csproj -c Debug --no-build -o .\artifacts\packages -v q
        dotnet pack .\src\Mediator.SourceGenerator\Mediator.SourceGenerator.csproj -c Debug --no-build -o .\artifacts\packages -v q
        $package = Get-ChildItem .\artifacts\packages\Mediator.SourceGenerator.*.nupkg | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
        $version = $package.BaseName.Substring('Mediator.SourceGenerator.'.Length)
        "version=$version" >> $env:GITHUB_OUTPUT

    - name: Create local NuGet config
      shell: pwsh
      run: |
        @"
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <clear />
            <add key="local" value="${{ github.workspace }}\artifacts\packages" />
            <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
          </packageSources>
          <packageSourceMapping>
            <packageSource key="local">
              <package pattern="Mediator.SourceGenerator" />
              <package pattern="Mediator.Abstractions" />
            </packageSource>
            <packageSource key="nuget.org">
              <package pattern="*" />
            </packageSource>
          </packageSourceMapping>
        </configuration>
        "@ | Set-Content -Path .\NuGet.Local.config -Encoding UTF8

    - name: Restore Packages
      run: |
        msbuild .\Console\Console.csproj -t:Restore `
          -p:RestoreConfigFile=NuGet.Local.config `
          -p:UseLocalMediatorProjects=false `
          -p:MediatorPackageVersion=${{ steps.pack.outputs.version }}

    - name: Build solution
      run: |
        msbuild .\Console\Console.csproj -t:Rebuild `
          -p:UseLocalMediatorProjects=false `
          -p:MediatorPackageVersion=${{ steps.pack.outputs.version }}

    - name: Run Console
      run: .\Console\bin\Debug\Console.NetFramework.exe

  publish:
    if: ${{ always() }}
    needs: [build, samples-net, samples-net-nupkg, samples-aot, samples-netfx]
    runs-on: ubuntu-latest

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
    - name: Check for failures
      run: exit 1
      if: >-
        ${{
             contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || contains(needs.*.result, 'skipped')
        }}

    - uses: actions/checkout@v2
      with:
        fetch-depth: 0 # depth is needed for nbgv

    - name: Setup .NET
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: '8.0.x'
        include-prerelease: false

    - uses: dotnet/nbgv@master
      with:
        setAllVars: true

    - uses: actions/cache@v3
      with:
        path: ${{ github.workspace }}/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.*.props', 'NuGet.config') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore

    - name: Clean
      run: dotnet clean -v m

    - name: Build
      run: dotnet build --no-restore -c Release

    - name: Test
      run: dotnet test --no-restore --no-build -c Release --logger "console;verbosity=detailed"

    - name: Pack
      run: |
        dotnet pack src/Mediator/Mediator.csproj --no-restore --no-build --verbosity normal -c Release -o artifacts/ && \
        dotnet pack src/Mediator.SourceGenerator/Mediator.SourceGenerator.csproj --no-restore --no-build --verbosity normal -c Release -o artifacts/

    - name: Push to NuGet
      if: ${{ success() && github.event_name != 'pull_request' }}
      run: dotnet nuget push artifacts/**.nupkg -s https://api.nuget.org/v3/index.json --api-key ${{secrets.NUGET_API_KEY}}
